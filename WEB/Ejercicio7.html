<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We all love Nature</title>
</head>
<body>

    <!-- 1. Un encabezado (<header>) -->
    <header>
        <!-- Con una barra de navegación (<nav>) -->
        <nav>
            <!-- Contiene una imagen (<img>) para el logotipo -->
            <a href="#">
                <img src="logo.png" alt="Logotipo Nature">
            </a>
            
            <!-- Enlaces de navegación (<a>) -->
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <!-- Donde uno de los enlaces es un botón (<button>) -->
                <li>
                    <a href="tel:2025053333">
                        <button type="button">202-505-3333</button>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- 2. Capa (<div>) debajo del menú de navegación, que contiene dos (p), un (h1) y un button -->
        <div>
            <p>We all love</p>
            <h1>Nature</h1>
            <p>Look deep into nature, and you will understand everything better.</p>
            <button type="button">Get started</button>
        </div>
    </header>

</body>
</html>
