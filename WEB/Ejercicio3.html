<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de registro de usuario completo en HTML.">
    <meta name="author" content="Tu Nombre">
    <title>Formulario de Registro</title>
</head>
<body>

    <h1>Formulario de Registro de Usuario</h1>
    <p>Por favor, completa los siguientes campos para crear tu cuenta. Los campos marcados con (*) son obligatorios.</p>

    <form action="#" method="POST">

        <!-- 1. INFORMACIÓN PERSONAL -->
        <fieldset>
            <legend>Información Personal</legend>
            
            <p>
                <label for="nombre">Nombre *:</label><br>
                <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
                <label for="apellido">Apellido *:</label><br>
                <input type="text" id="apellido" name="apellido" required>
            </p>

            <p>
                <label for="fecha-nacimiento">Fecha de Nacimiento *:</label><br>
                <input type="date" id="fecha-nacimiento" name="fecha_nacimiento" required>
            </p>

            <p>
                <label>Género *:</label><br>
                <input type="radio" id="genero-masculino" name="genero" value="masculino" required>
                <label for="genero-masculino">Masculino</label><br>

                <input type="radio" id="genero-femenino" name="genero" value="femenino">
                <label for="genero-femenino">Femenino</label><br>

                <input type="radio" id="genero-otro" name="genero" value="otro">
                <label for="genero-otro">Otro</label>
            </p>
        </fieldset>

        <br>

        <!-- 2. INFORMACIÓN DE CONTACTO -->
        <fieldset>
            <legend>Información de Contacto</legend>

            <p>
                <label for="email">Correo Electrónico *:</label><br>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </p>

            <p>
                <label for="telefono">Número de Teléfono *:</label><br>
                <input type="tel" id="telefono" name="telefono" required>
            </p>

            <p>
                <label for="direccion">Dirección:</label><br>
                <textarea id="direccion" name="direccion" rows="4" cols="40" placeholder="Escribe tu dirección completa aquí..."></textarea>
            </p>
        </fieldset>

        <br>

        <!-- 3. INFORMACIÓN DE CUENTA -->
        <fieldset>
            <legend>Información de Cuenta</legend>

            <p>
                <label for="usuario">Nombre de Usuario *:</label><br>
                <input type="text" id="usuario" name="usuario" required>
            </p>

            <p>
                <label for="password">Contraseña *:</label><br>
                <input type="password" id="password" name="password
